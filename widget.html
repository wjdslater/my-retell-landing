<!DOCTYPE html>
<html>
<head>
  <title>Widget Demo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .widget-container {
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-width: 600px;
      margin: 20px auto;
    }
    .button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <h2>Widget Demo</h2>
    <p>This is a simple HTML widget for testing the GitHub Pages deployment.</p>
    <button class="button" onclick="alert('Widget button clicked!')">Test Widget</button>
  </div>
</body>
</html>
