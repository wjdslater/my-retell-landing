name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, integrate-lovable-widget ]  # Added your working branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out  # The folder the action should deploy
          branch: integrate-lovable-widget  # Changed to your current branch
          clean: false  # Don't remove existing files
          clean-exclude: |
            .git
            .github
            src
            pages
            public
            package.json
            package-lock.json
            tsconfig.json
            next.config.js
